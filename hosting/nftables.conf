#!/usr/sbin/nft -f
# Written by garage setup, which overwrites it on every run. Nothing reaches
# this host unasked except SSH and the UI (garage serve, :8080) from one range.
flush ruleset

table inet garage {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		meta l4proto { icmp, ipv6-icmp } accept
		{{.Family}} saddr {{.SSHFrom}} tcp dport 22 accept
		{{.Family}} saddr {{.SSHFrom}} tcp dport 8080 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
