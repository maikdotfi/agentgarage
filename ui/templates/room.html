{{define "title"}}{{.Room}} · garage{{end}}
{{define "crumb"}}<span class="sep">/</span><span class="here">{{.Room}}</span>{{end}}
{{define "main"}}
{{if .Session.Agent}}
<p class="empty">This room is <a href="/agents/{{.Session.Agent}}/sessions/{{.Session.ID}}">{{.Session.Agent}}'s session {{.Session.ID}}</a>.</p>
{{end}}
<div class="log">
  <ol class="messages" data-events="{{roomURL .Room}}/events?after={{.After}}">{{range .Messages}}{{template "message" .}}{{end}}</ol>
</div>
<script>
{ // New messages stream in, rendered by the server; the browser resumes from the last ID after a drop.
  const log = document.querySelector("ol.messages");
  window.roomEvents?.close(); // a boosted post swaps the page in again
  window.roomEvents = new EventSource(log.dataset.events);
  window.roomEvents.onmessage = e => {
    if (!document.getElementById("m" + e.lastEventId)) log.insertAdjacentHTML("beforeend", e.data);
  };
}
</script>
<form class="post" action="{{roomURL .Room}}/messages" method="post" hx-boost="true">
  <input name="as" value="{{.As}}" placeholder="you" aria-label="post as" required autocomplete="username">
  <textarea name="text" rows="2" placeholder="message, @dev to wake dev · Enter sends, Shift+Enter is a new line" aria-label="message" required autofocus
    onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();this.form.requestSubmit()}"></textarea>
  <button>send</button>
</form>
{{end}}
